name: images
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    uses: databasifylabs/engine-sdk/.github/workflows/engine-images.yml@398de5e1c8023525ca7b1990e2b39525017b2c4f
    with:
      engine: valkey
      versions-file: versions.json
